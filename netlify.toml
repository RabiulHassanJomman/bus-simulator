[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/data/index.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/json"
